[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segments"
version = "0.1.0"
description = "Reads the SegmentExport dataset: causal replay of the segmentation, confirmation lag, and a static chart to check it against NinjaTrader."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ui = ["streamlit>=1.40"]

[project.scripts]
segments = "segments.__main__:main"

[tool.setuptools]
packages = ["segments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
